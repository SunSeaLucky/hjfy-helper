<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hjfy arXiv Helper 设置</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --border: #e5e5e5;
      --text: #1a1a1a;
      --dim: #767676;
      --hover: #f6f6f6;
      --dot: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --card: #1e1e1e;
        --border: #333333;
        --text: #eaeaea;
        --dim: #9a9a9a;
        --hover: #242424;
        --dot: #eaeaea;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .lede {
      margin: 6px 0 0;
      color: var(--dim);
      font-size: 13px;
    }
    section { margin-top: 44px; }
    h2 {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .desc {
      margin: 0 0 12px;
      color: var(--dim);
      font-size: 13px;
    }
    .group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .row + .row { border-top: 1px solid var(--border); }
    .row:hover { background: var(--hover); }
    .row input {
      appearance: none;
      -webkit-appearance: none;
      flex: none;
      width: 16px;
      height: 16px;
      margin: 0;
      border: 1.5px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      transition: border 0.12s ease;
    }
    .row input:checked { border: 5px solid var(--dot); }
    .row input:focus-visible {
      outline: 2px solid var(--dot);
      outline-offset: 2px;
    }
    .row .name { flex: 1; }
    .row .note {
      color: var(--dim);
      font-size: 12.5px;
    }
    footer {
      margin-top: 44px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--dim);
      font-size: 12.5px;
    }
    #saved {
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #saved.show { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <h1>hjfy arXiv Helper</h1>
    <p class="lede">设置</p>

    <section>
      <h2>跳转方式</h2>
      <p class="desc">点击工具栏图标时，如何打开目标页面。</p>
      <div class="group">
        <label class="row">
          <input type="radio" name="openMode" value="new-tab">
          <span class="name">在新标签页打开</span>
          <span class="note">保留当前页面</span>
        </label>
        <label class="row">
          <input type="radio" name="openMode" value="current-tab">
          <span class="name">在当前页面打开</span>
          <span class="note">直接跳转</span>
        </label>
      </div>
    </section>

    <section>
      <h2>AI 助手</h2>
      <p class="desc">右键图标菜单"解释这篇论文"所使用的 AI。仅列出支持通过链接直接提问的服务。</p>
      <div class="group">
        <label class="row">
          <input type="radio" name="aiTarget" value="chatgpt">
          <span class="name">ChatGPT</span>
          <span class="note">chatgpt.com</span>
        </label>
        <label class="row">
          <input type="radio" name="aiTarget" value="claude">
          <span class="name">Claude</span>
          <span class="note">claude.ai</span>
        </label>
        <label class="row">
          <input type="radio" name="aiTarget" value="perplexity">
          <span class="name">Perplexity</span>
          <span class="note">perplexity.ai</span>
        </label>
        <label class="row">
          <input type="radio" name="aiTarget" value="grok">
          <span class="name">Grok</span>
          <span class="note">grok.com</span>
        </label>
      </div>
    </section>

    <footer>
      <span>设置会自动保存并随 Chrome 同步。</span>
      <span id="saved">已保存</span>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
