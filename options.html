<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>hjfy arXiv Helper 设置</title>
  <style>
    :root {
      --bg: #fafafa;
      --card-bg: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --text-dim: #71717a;
      --accent: #b31b1b; /* arXiv red */
      --accent-soft: rgba(179, 27, 27, 0.06);
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1f;
        --card-bg: #26262a;
        --border: #3f3f46;
        --text: #f4f4f5;
        --text-dim: #a1a1aa;
        --accent: #ef6461;
        --accent-soft: rgba(239, 100, 97, 0.1);
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 24px;
      width: 400px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .subtitle {
      margin: 0 0 20px;
      color: var(--text-dim);
      font-size: 12.5px;
    }
    .options { display: grid; gap: 10px; }
    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .option:hover { border-color: var(--text-dim); }
    .option input { position: absolute; opacity: 0; pointer-events: none; }
    .option:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .option:has(input:focus-visible) {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .glyph {
      flex: none;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .option:has(input:checked) .glyph {
      color: var(--accent);
      border-color: transparent;
      background: var(--card-bg);
    }
    .label { flex: 1; min-width: 0; }
    .label strong {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
    }
    .label span {
      display: block;
      margin-top: 2px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.45;
    }
    .check {
      flex: none;
      width: 20px;
      height: 20px;
      color: var(--accent);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .option:has(input:checked) .check {
      opacity: 1;
      transform: scale(1);
    }
    .footer {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 18px;
    }
    .hint { color: var(--text-dim); font-size: 11.5px; }
    #saved {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #saved.show { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <h1>跳转方式</h1>
  <p class="subtitle">点击工具栏图标时，如何打开目标页面</p>

  <div class="options">
    <label class="option">
      <input type="radio" name="openMode" value="new-tab">
      <span class="glyph" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5.5" width="10" height="10" rx="2"/>
          <path d="M8 4.5V4a2 2 0 0 1 2-2h5.5a2 2 0 0 1 2 2v5.5a2 2 0 0 1-2 2H15"/>
        </svg>
      </span>
      <span class="label">
        <strong>在新标签页打开</strong>
        <span>保留当前页面，在旁边新开一个标签页</span>
      </span>
      <svg class="check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 10.5l4 4 8-9"/>
      </svg>
    </label>

    <label class="option">
      <input type="radio" name="openMode" value="current-tab">
      <span class="glyph" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="2.5" width="15" height="15" rx="2"/>
          <path d="M7 10h6M10.5 7.5L13 10l-2.5 2.5"/>
        </svg>
      </span>
      <span class="label">
        <strong>在当前页面打开</strong>
        <span>直接跳转，不新开标签页</span>
      </span>
      <svg class="check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 10.5l4 4 8-9"/>
      </svg>
    </label>
  </div>

  <div class="footer">
    <span class="hint">设置会自动保存并同步</span>
    <span id="saved">
      <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 10.5l4 4 8-9"/>
      </svg>
      已保存
    </span>
  </div>

  <script src="options.js"></script>
</body>
</html>
